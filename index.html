<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>weatepdf — Free Online PDF Editor, No Watermark, No Upload</title>
  <meta name="description" content="Edit, merge, split, compress, and convert PDFs instantly in your browser. 100% free, no watermark, no sign-up — your files never leave your device." />
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%96%A3%3C/text%3E%3C/svg%3E" />
  <!-- Inline baseline: guarantees the layout renders even if styles.css is blocked or cached stale. styles.css (loaded after) refines it. -->
  <style>
    :root{--bg:#07080c;--surf:#0d0f16;--card:rgba(255,255,255,.035);--line:rgba(255,255,255,.085);--tx:#f2f3f7;--mut:#9296a6;--a:#6366f1;--hd:rgba(7,8,12,.72);--hd-h:64px;--side-w:260px}
    [data-theme=light]{--bg:#f4f6fb;--surf:#fff;--card:rgba(255,255,255,.85);--line:rgba(20,24,45,.09);--tx:#10131c;--mut:#5b6174;--hd:rgba(244,246,251,.78)}
    *{box-sizing:border-box;margin:0}
    body{background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
    button{background:none;border:0;cursor:pointer;color:inherit;font:inherit}
    a{color:inherit;text-decoration:none}
    .hidden{display:none!important}
    .site-header{position:sticky;top:0;z-index:100;height:var(--hd-h);display:flex;align-items:center;background:var(--hd);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .container{width:100%;max-width:1400px;margin:0 auto;padding:0 20px}
    .header-inner{display:flex;align-items:center;gap:14px;height:100%}
    .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;white-space:nowrap}
    .brand-mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a),#22d3ee);flex:none}
    .search-btn{display:flex;align-items:center;gap:10px;flex:1 1 auto;max-width:420px;height:38px;margin:0 auto;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--mut)}
    .header-actions{display:flex;align-items:center;gap:14px;margin-left:auto;flex:none}
    .privacy-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;background:var(--card);white-space:nowrap}
    .dot{width:7px;height:7px;border-radius:50%;background:#34d399;flex:none}
    .nav-toggle{display:none;width:36px;height:36px;border:1px solid var(--line);border-radius:9px;place-items:center;flex:none}
    .shell.container{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);align-items:start;max-width:1400px;margin:0 auto;padding:0 20px}
    .sidebar{position:sticky;top:var(--hd-h);align-self:start;width:var(--side-w);height:calc(100vh - var(--hd-h));overflow-y:auto;padding:18px 12px 28px;border-right:1px solid var(--line);background:var(--surf)}
    .sb-home{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;color:var(--mut);font-size:13.5px;font-weight:600}
    .sb-home:hover,.sb-home.active{background:var(--card);color:var(--tx)}
    .sb-label{padding:16px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
    .sb-group{margin-bottom:6px}
    .sb-title{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
    .sb-count{margin-left:auto;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:10.5px}
    .sb-link{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border-radius:9px;color:var(--mut);font-size:13px;line-height:1.3}
    .sb-link:hover{background:var(--card);color:var(--tx)}
    .sb-link.active{background:var(--card);color:var(--tx);font-weight:600}
    .sb-note{display:flex;align-items:flex-start;gap:8px;margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:11.5px;color:var(--mut)}
    .sb-close{display:none}
    .sb-ic{width:18px;text-align:center;flex:none}
    .sidebar-backdrop{display:none}
    .view{min-width:0;padding:32px 8px 80px 36px}
    .hero{text-align:center;padding:44px 0 8px}
    .hero h1{font-size:clamp(32px,5vw,60px);line-height:1.04;font-weight:800}
    .tagline{max-width:660px;margin:20px auto 0;color:var(--mut)}
    .badges{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px auto 0;padding:0}
    .badges li{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--mut)}
    .home-upload{max-width:620px;margin:30px auto 0}
    .dropzone{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 24px;text-align:center;background:var(--card);border:2px dashed var(--line);border-radius:20px;cursor:pointer}
    .dz-input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .dz-icon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:rgba(99,102,241,.22);border:1px solid var(--line);margin-bottom:8px}
    .dz-title{font-size:17px;font-weight:700}
    .dz-sub{font-size:13.5px;color:var(--mut)}
    .dz-hint{font-size:12px;color:var(--mut);opacity:.8}
    .tool-tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;margin:30px 0 4px}
    .tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--mut)}
    .tab.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--a),#4f46e5)}
    .category{padding-top:26px}
    .category h2{font-size:20px;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .card{display:flex;flex-direction:column;gap:10px;padding:16px;min-height:112px;background:var(--card);border:1px solid var(--line);border-radius:12px}
    .card:hover{transform:translateY(-2px);border-color:var(--a)}
    .c-name{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
    .c-ic,.hit-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(99,102,241,.2);border:1px solid var(--line);flex:none}
    .c-desc{color:var(--mut);font-size:12.5px}
    .site-footer{border-top:1px solid var(--line);margin-top:56px;padding:28px 0 40px;color:var(--mut);font-size:13px}
    .footer-inner{display:flex;flex-direction:column;gap:6px}
    @media(max-width:1024px){
      .shell.container{grid-template-columns:minmax(0,1fr);padding:0 16px}
      .view{padding:24px 4px 64px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .nav-toggle{display:grid}
      .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:220;width:min(300px,86vw);height:100vh;transform:translateX(-100%);transition:transform .25s}
      .sidebar.open{transform:none}
      .sb-close{display:grid;place-items:center;position:absolute;top:12px;right:12px;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut)}
      .sidebar-backdrop.show{display:block;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55)}
      .header-actions .header-link{display:none}
    }
    @media(max-width:768px){.search-btn{max-width:none}.privacy-pill{display:none}}
    @media(max-width:640px){.grid{grid-template-columns:1fr}.view{padding:20px 2px 56px}.brand-tld{display:none}.header-inner{gap:10px}}
  </style>
  <link rel="stylesheet" href="styles.css?v=20261102" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <button class="nav-toggle" id="nav-toggle" aria-label="Open tools menu">☰</button>
      <a href="#/" class="brand"><span class="brand-mark">▣</span> weatepdf</a>
      <button class="search-btn" id="search-open">
        <span class="search-label">Search tools…</span>
        <kbd>⌘K</kbd>
      </button>
      <div class="header-actions">
        <a href="#/" class="header-link">Dashboard</a>
        <span class="privacy-pill"><span class="dot"></span> 100% private</span>
      </div>
    </div>
  </header>

  <div class="shell container">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main id="view" class="view"></main>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><strong>weatepdf.cv</strong> — every tool is 100% free, forever, with no watermark. All processing happens locally in your browser using JavaScript and WebAssembly. Your files are never uploaded.</p>
      <p class="footer-sub">No sign-up · No file size caps · No daily limits</p>
      <p class="footer-dev">Developed by Prajwal</p>
    </div>
  </footer>

  <div id="search-modal" class="search-modal hidden" role="dialog" aria-modal="true" aria-label="Search tools">
    <div class="search-card">
      <input id="search-input" type="search" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <div id="toast-root"></div>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/tesseract.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="app.js?v=20261103"></script>
</body>
</html>
